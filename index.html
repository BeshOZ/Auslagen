<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auslagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Karla:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2420; --paper:#EDEFEA; --surface:#F7F8F4; --line:#C9CFC6;
    --muted:#68746C; --amber:#C0842A; --alert:#9E3423; --green:#3F6B4E;
    --sans:"Karla","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Instrument Serif","Noto Sans Arabic",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir=rtl] body{font-family:"Noto Sans Arabic","Karla",sans-serif}
  [dir=rtl] .big,[dir=rtl] .split b,[dir=rtl] .row .d,[dir=rtl] .row .amt{font-family:"Noto Sans Arabic",var(--serif)}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 90px}
  h1{font-family:var(--serif);font-size:29px;font-weight:400;margin:0}
  [dir=rtl] h1{font-family:"Noto Sans Arabic",var(--serif);font-weight:500;font-size:25px}
  h1 span{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px;font-weight:400}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
  .who{font-size:12.5px;color:var(--muted);text-align:end}
  .who button{display:block;margin-inline-start:auto;margin-top:3px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12.5px;padding:0}

  .langs{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--line);border-radius:20px;overflow:hidden;width:fit-content}
  .langs button{font-family:inherit;font-size:12.5px;padding:5px 13px;background:none;border:none;cursor:pointer;color:var(--muted)}
  .langs button.on{background:var(--ink);color:var(--paper)}

  .gate{max-width:420px;margin:12vh auto;padding:0 20px}
  .gate p{font-size:14px;color:var(--muted);margin:0 0 16px;max-width:42ch}

  .balance{border:1.5px solid var(--ink);border-radius:4px;padding:20px;margin-bottom:14px;background:var(--surface)}
  .big{font-family:var(--serif);font-size:56px;line-height:1.05;letter-spacing:-.01em}
  .big.neg{color:var(--alert)}
  .balance .cap{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:46ch}
  .split{display:flex;gap:26px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .split div{font-size:13px;color:var(--muted)}
  .split b{display:block;font-family:var(--serif);font-size:23px;font-weight:400;color:var(--ink)}
  .split b.in{color:var(--green)}

  .filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:24px;font-size:13px;color:var(--muted)}
  .filter input{font-family:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  .chip{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .strip{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:26px;font-size:13.5px;color:var(--muted)}
  .track{flex:1;height:6px;background:#DDE1D9;border-radius:3px;overflow:hidden;min-width:70px}
  .track i{display:block;height:100%;background:var(--amber);transition:width .4s ease}
  .track.over i{background:var(--alert)}

  .tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:20px}
  .tab{font-family:inherit;font-size:15px;background:none;border:none;padding:9px 16px;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
  .tab.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}

  form{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
  input,textarea,select{width:100%;font-family:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:46px}
  input[type=file]{font-size:13px;padding:6px;background:none;border-style:dashed}
  input[type=url],input[type=email],input[type=number]{direction:ltr;text-align:start}
  button.go{font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--ink);border-radius:3px;padding:10px 18px;background:var(--ink);color:var(--paper)}
  button.go[disabled]{opacity:.5;cursor:default}
  .ghost{font-family:inherit;font-size:14px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  h2{font-size:12.5px;font-weight:700;margin:22px 0 6px;color:var(--muted)}
  .row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row .d{font-family:var(--serif);font-size:15px;color:var(--muted);flex:none;width:52px;padding-top:2px}
  .row .b{flex:1;min-width:0}
  .row .t{font-weight:500;word-break:break-word}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
  .row .amt{font-family:var(--serif);font-size:20px;flex:none;text-align:end;min-width:76px}
  .row .amt.in{color:var(--green)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--muted);background:#fff;text-decoration:none;cursor:pointer;font-family:inherit}
  .tag.st{border-color:var(--amber);color:#8A5E18}
  .tag.st.done{border-color:var(--green);color:var(--green)}
  .tag.code{direction:ltr;unicode-bidi:embed}
  .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
  .del:hover{color:var(--alert)}
  .empty{border:1px dashed var(--line);border-radius:4px;padding:24px;text-align:center;color:var(--muted);font-size:14.5px}
  .bar{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}
  .status{font-size:13px;color:var(--muted);margin-top:12px;min-height:19px}
  .status.err{color:var(--alert)}

  .modal{position:fixed;inset:0;background:rgba(27,36,32,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  .modal.on{display:flex}
  .modal img{max-width:100%;max-height:86vh;border-radius:4px}
  .modal button{position:absolute;top:14px;inset-inline-end:18px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer}

  @media (max-width:520px){.grid{grid-template-columns:1fr}.big{font-size:44px}}
  @media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="gate" id="gate" hidden>
  <div class="langs" id="langsGate"></div>
  <h1 id="gTitle">Auslagen<span id="gTag"></span></h1>
  <p id="gIntro"></p>
  <form id="fLogin">
    <label for="email" id="lEmail"></label>
    <input id="email" type="email" required autocomplete="email" placeholder="name@mail.com">
    <div style="margin-top:12px"><button class="go" type="submit" id="loginBtn"></button></div>
  </form>
  <div class="status" id="gateStatus" role="status"></div>
</div>

<!-- ============ APP ============ -->
<div class="wrap" id="app" hidden>

<div class="top">
  <h1 id="aTitle">Auslagen<span id="aTag"></span></h1>
  <div class="who"><span id="me"></span><button id="out"></button></div>
</div>

<div class="langs" id="langsApp"></div>

<section class="balance">
  <div class="big" id="bal">€0,00</div>
  <div class="cap" id="balcap"></div>
  <div class="split">
    <div id="lIn">​<b class="in" id="sIn">€0</b></div>
    <div id="lOut">​<b id="sOut">€0</b></div>
    <div id="lN">​<b id="sN">0</b></div>
    <div id="lOpen">​<b id="sOpen">0</b></div>
  </div>
</section>

<div class="filter">
  <span id="lPeriod"></span>
  <input type="date" id="from">
  <input type="date" id="to">
  <button class="chip" data-r="year"></button>
  <button class="chip" data-r="30"></button>
  <button class="chip" data-r="all"></button>
</div>

<div class="strip">
  <span><span id="lTip"></span> <span id="tipY"></span></span>
  <div class="track" id="track"><i id="tipbar" style="width:0"></i></div>
  <span id="tiptxt"></span>
</div>

<div class="tabs">
  <button class="tab on" data-t="buy" id="tabBuy"></button>
  <button class="tab" data-t="tr" id="tabTr"></button>
</div>

<div id="paneBuy">
  <form id="fBuy">
    <div class="grid">
      <div class="full"><label for="b_item" id="lItem"></label><input id="b_item" required></div>
      <div><label for="b_date" id="lDate1"></label><input id="b_date" type="date" required></div>
      <div><label for="b_paid" id="lPaid"></label><input id="b_paid" type="number" step="0.01" min="0" required placeholder="0.00"></div>
      <div class="full"><label for="b_link" id="lLink"></label><input id="b_link" type="url" placeholder="https://"></div>
      <div><label for="b_stat" id="lStat"></label><select id="b_stat"></select></div>
      <div><label for="b_track" id="lTrackNo"></label><input id="b_track"></div>
      <div class="full"><label for="b_turl" id="lTrackUrl"></label><input id="b_turl" type="url" placeholder="https://"></div>
      <div class="full"><label for="b_img" id="lShot"></label><input id="b_img" type="file" accept="image/*"></div>
      <div class="full"><label for="b_note" id="lNote1"></label><textarea id="b_note"></textarea></div>
      <div class="full"><button class="go" type="submit" id="bSave"></button></div>
    </div>
  </form>
  <div id="listBuy"></div>
</div>

<div id="paneTr" hidden>
  <form id="fTr">
    <div class="grid">
      <div><label for="t_name" id="lSender"></label><input id="t_name" required list="senders"><datalist id="senders"></datalist></div>
      <div><label for="t_date" id="lDate2"></label><input id="t_date" type="date" required></div>
      <div><label for="t_amt" id="lAmount"></label><input id="t_amt" type="number" step="0.01" min="0" required placeholder="0.00"></div>
      <div><label for="t_tip" id="lTipAmt"></label><input id="t_tip" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="full"><label for="t_img" id="lReceipt"></label><input id="t_img" type="file" accept="image/*"></div>
      <div class="full"><label for="t_note" id="lNote2"></label><textarea id="t_note"></textarea></div>
      <div class="full"><button class="go" type="submit" id="tSave"></button></div>
    </div>
  </form>
  <div id="listTr"></div>
</div>

<div class="bar"><button class="ghost" id="csv"></button></div>
<div class="status" id="status" role="status"></div>
</div>

<div class="modal" id="modal"><button id="mx" aria-label="×">×</button><img id="mimg" alt=""></div>

function pickLang(){
  try { const s = localStorage.getItem('auslagen.lang'); if (LANGS.includes(s)) return s; } catch {}
  const n = (navigator.language || 'de').slice(0,2);
  return LANGS.includes(n) ? n : 'de';
}
const t = k => T[lang][k];

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const LIMIT = 256, BUCKET = 'belege';
let buys = [], trs = [], uid = null, from = '', to = '';

const $ = i => document.getElementById(i);
function fmt(n, dec){
  try { return new Intl.NumberFormat(T[lang]._locale,
    {style:'currency', currency:'EUR', minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n); }
  catch { return '€' + n.toFixed(dec); }
}
const eur = n => fmt(n, 2), eur0 = n => fmt(Math.round(n), 0);

/* ---------- apply language ---------- */
function buildLangBar(el){
  el.innerHTML = LANGS.map(l =>
    `<button data-l="${l}"${l===lang?' class="on"':''}>${T[l]._name}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => setLang(b.dataset.l));
}
function setLang(l){
  lang = l;
  try { localStorage.setItem('auslagen.lang', l); } catch {}
  applyLang();
  if (uid) render();
}
function applyLang(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = d._dir;
  const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
  const ph  = (id, v) => { const e = $(id); if (e) e.placeholder = v; };

  set('gTag', d.gateTag); set('gIntro', d.gateIntro); set('lEmail', d.email);
  set('loginBtn', d.sendLink);
  set('aTag', d.tag); set('out', d.signout);
  set('lIn', d.transferred); set('lOut', d.spent); set('lN', d.count); set('lOpen', d.open);
  set('lPeriod', d.period); set('lTip', d.tip);
  document.querySelector('.chip[data-r="year"]').textContent = d.thisYear;
  document.querySelector('.chip[data-r="30"]').textContent   = d.d30;
  document.querySelector('.chip[data-r="all"]').textContent  = d.all;
  set('tabBuy', d.tabBuy); set('tabTr', d.tabTr);
  set('lItem', d.item); set('lDate1', d.date); set('lPaid', d.paid); set('lLink', d.link);
  set('lStat', d.deliveryStatus); set('lTrackNo', d.trackNo); set('lTrackUrl', d.trackUrl);
  set('lShot', d.shot); set('lNote1', d.note); set('bSave', d.savePurchase);
  set('lSender', d.sender); set('lDate2', d.date); set('lAmount', d.amount); set('lTipAmt', d.tipAmt);
  set('lReceipt', d.receipt); set('lNote2', d.note); set('tSave', d.saveTransfer);
  set('csv', d.exportCsv);
  ph('b_item', d.itemPh); ph('b_note', d.notePh); ph('t_name', d.senderPh); ph('t_note', d.notePh2);
  ph('b_track', '00340434…');

  const sel = $('b_stat'), keep = sel.value || 'ordered';
  sel.innerHTML = STATUSES.map(s => `<option value="${s}">${d.st[s]}</option>`).join('');
  sel.value = keep;

  buildLangBar($('langsGate')); buildLangBar($('langsApp'));
}

/* ---------- auth ---------- */
$('fLogin').onsubmit = async e => {
  e.preventDefault();
  $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email: $('email').value.trim(),
    options: { emailRedirectTo: window.location.href }
  });
  $('loginBtn').disabled = false;
  const s = $('gateStatus');
  if (error){ s.textContent = t('errLogin') + error.message; s.className = 'status err'; }
  else { s.textContent = t('linkSent'); s.className = 'status'; }
};
$('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };

applyLang();
sb.auth.onAuthStateChange((_e, session) => start(session));
const { data:{ session } } = await sb.auth.getSession();
start(session);

function start(session){
  if (!session){ $('gate').hidden = false; $('app').hidden = true; return; }
  if (uid === session.user.id) return;
  uid = session.user.id;
  $('gate').hidden = true; $('app').hidden = false;
  $('me').textContent = session.user.email;
  $('b_date').valueAsDate = new Date();
  $('t_date').valueAsDate = new Date();
  document.querySelector('.chip[data-r="year"]').click();
  loadAll();
}

/* ---------- data ---------- */
async function loadAll(){
  say(t('loading'));
  const [p, tr] = await Promise.all([
    sb.from('purchases').select('*').order('date',{ascending:false}),
    sb.from('transfers').select('*').order('date',{ascending:false})
  ]);
  if (p.error || tr.error) return say(t('errLoad') + (p.error||tr.error).message, true);
  buys = p.data.map(r => ({...r, paid:+r.paid}));
  trs  = tr.data.map(r => ({...r, amount:+r.amount, tip:+r.tip}));
  say(''); render();
}

function shrink(file, max = 1100, qual = .7){
  return new Promise(res => {
    if (!file) return res(null);
    const fr = new FileReader();
    fr.onload = () => { const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = im.width * s; c.height = im.height * s;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => res(b), 'image/jpeg', qual);
      };
      im.onerror = () => res(null); im.src = fr.result; };
    fr.onerror = () => res(null); fr.readAsDataURL(file);
  });
}
async function upload(file){
  const blob = await shrink(file);
  if (!blob) return null;
  const path = `${uid}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg' });
  if (error){ say(t('errImg') + error.message, true); return null; }
  return path;
}
async function showImg(path){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 120);
  if (error) return say(t('errImgFind'), true);
  $('mimg').src = data.signedUrl; $('modal').classList.add('on');
}
$('mx').onclick = () => $('modal').classList.remove('on');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('on'); };

/* ---------- render ---------- */
function group(rows, fn){
  let h = '', m = '';
  for (const r of rows){
    const lbl = new Date(r.date + 'T12:00').toLocaleDateString(T[lang]._locale, {month:'long', year:'numeric'});
    if (lbl !== m){ m = lbl; h += '<h2>' + lbl + '</h2>'; }
    h += fn(r);
  }
  return h;
}

function render(){
  const d  = T[lang];
  const fb = buys.filter(b => inR(b.date));
  const ft = trs.filter(x => inR(x.date));
  const out = fb.reduce((s,b) => s + b.paid, 0);
  const inn = ft.reduce((s,x) => s + x.amount, 0);

  const bal = trs.reduce((s,x) => s + x.amount, 0) - buys.reduce((s,b) => s + b.paid, 0);
  $('bal').textContent = eur(bal);
  $('bal').className = 'big' + (bal < 0 ? ' neg' : '');
  $('balcap').textContent = bal < 0 ? d.balCapNeg : d.balCap;

  $('sIn').textContent  = eur0(inn);
  $('sOut').textContent = eur0(out);
  $('sN').textContent   = fb.length;
  $('sOpen').textContent = buys.filter(b => b.status !== 'handed' && b.status !== 'delivered').length;

  const y = (to || new Date().toISOString().slice(0,10)).slice(0,4);
  const tip = trs.filter(x => x.date.slice(0,4) === y).reduce((s,x) => s + (x.tip||0), 0);
  $('tipY').textContent = y;
  $('tipbar').style.width = Math.min(100, tip / LIMIT * 100) + '%';
  $('track').classList.toggle('over', tip > LIMIT);
  $('tiptxt').textContent = tip > LIMIT ? eur0(tip) + ' — ' + d.over : eur0(tip) + ' ' + d.ofLimit;

  $('senders').innerHTML = [...new Set(trs.map(x => x.sender))].map(n => '<option value="'+esc(n)+'">').join('');

  $('listBuy').innerHTML = fb.length ? group(fb, b => {
    const done = b.status === 'handed' || b.status === 'delivered';
    return '<div class="row"><div class="d">'+b.date.slice(8,10)+'.'+b.date.slice(5,7)+'.</div><div class="b">'
      + '<div class="t">'+esc(b.item)+'</div>'
      + (b.note ? '<div class="s">'+esc(b.note)+'</div>' : '')
      + '<div class="tags"><span class="tag st'+(done?' done':'')+'">'+esc(d.st[b.status] || b.status)+'</span>'
      + (b.link ? '<a class="tag" href="'+esc(b.link)+'" target="_blank" rel="noopener">'+d.product+'</a>' : '')
      + (b.tracking_url ? '<a class="tag" href="'+esc(b.tracking_url)+'" target="_blank" rel="noopener">'+d.tracking+'</a>' : '')
      + (b.tracking_no ? '<span class="tag code">'+esc(b.tracking_no)+'</span>' : '')
      + (b.image_path ? '<button class="tag" data-img="'+esc(b.image_path)+'">'+d.shotTag+'</button>' : '')
      + '</div></div><div class="amt">'+eur(b.paid)+'</div>'
      + '<button class="del" data-del="purchases:'+b.id+'" data-path="'+esc(b.image_path||'')+'">×</button></div>';
  }) : '<div class="empty">'+d.emptyBuy+'</div>';

  $('listTr').innerHTML = ft.length ? group(ft, x =>
      '<div class="row"><div class="d">'+x.date.slice(8,10)+'.'+x.date.slice(5,7)+'.</div><div class="b">'
    + '<div class="t">'+esc(x.sender)+'</div>'
    + (x.note ? '<div class="s">'+esc(x.note)+'</div>' : '')
    + '<div class="tags">'
    + (x.tip ? '<span class="tag st">'+d.tip+' '+eur(x.tip)+'</span>' : '')
    + (x.image_path ? '<button class="tag" data-img="'+esc(x.image_path)+'">'+d.receiptTag+'</button>' : '')
    + '</div></div><div class="amt in">+'+eur(x.amount)+'</div>'
    + '<button class="del" data-del="transfers:'+x.id+'" data-path="'+esc(x.image_path||'')+'">×</button></div>'
  ) : '<div class="empty">'+d.emptyTr+'</div>';

  document.querySelectorAll('[data-img]').forEach(b => b.onclick = () => showImg(b.dataset.img));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.dataset.del, b.dataset.path));
}

/* ---------- write ---------- */
$('fBuy').onsubmit = async e => {
  e.preventDefault();
  $('bSave').disabled = true; say(t('saving'));
  const image_path = await upload($('b_img').files[0]);
  const { error } = await sb.from('purchases').insert({
    date:$('b_date').value, item:$('b_item').value.trim(), paid:num($('b_paid').value),
    link:$('b_link').value.trim() || null, status:$('b_stat').value,
    tracking_no:$('b_track').value.trim() || null, tracking_url:$('b_turl').value.trim() || null,
    image_path, note:$('b_note').value.trim() || null
  });
  $('bSave').disabled = false;
  if (error) return say(t('errSave') + error.message, true);
  $('fBuy').reset(); applyLang(); $('b_date').valueAsDate = new Date();
  await loadAll(); say(t('savedBuy'));
};

$('fTr').onsubmit = async e => {
  e.preventDefault();
  $('tSave').disabled = true; say(t('saving'));
  const image_path = await upload($('t_img').files[0]);
  const { error } = await sb.from('transfers').insert({
    date:$('t_date').value, sender:$('t_name').value.trim(), amount:num($('t_amt').value),
    tip:num($('t_tip').value), image_path, note:$('t_note').value.trim() || null
  });
  $('tSave').disabled = false;
  if (error) return say(t('errSave') + error.message, true);
  $('fTr').reset(); $('t_date').valueAsDate = new Date();
  await loadAll(); say(t('savedTr'));
};

async function del(ref, path){
  const [table, id] = ref.split(':');
  if (!confirm(t('confirmDel'))) return;
  if (path) await sb.storage.from(BUCKET).remove([path]);
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) return say(t('errDel') + error.message, true);
  await loadAll(); say(t('deleted'));
}

/* ---------- filters, tabs, export ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('paneBuy').hidden = b.dataset.t !== 'buy';
  $('paneTr').hidden  = b.dataset.t !== 'tr';
});
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  const n = new Date(), iso = x => x.toISOString().slice(0,10);
  if (c.dataset.r === 'year'){ from = n.getFullYear()+'-01-01'; to = iso(n); }
  else if (c.dataset.r === '30'){ const x = new Date(n); x.setDate(x.getDate()-30); from = iso(x); to = iso(n); }
  else { from = ''; to = ''; }
  $('from').value = from; $('to').value = to;
  if (uid) render();
});
$('from').onchange = e => { from = e.target.value; render(); };
$('to').onchange   = e => { to   = e.target.value; render(); };

$('csv').onclick = () => {
  const d = T[lang];
  const lines = ['TYPE;Date;Name/Item;Amount;Surcharge;Status;TrackingNo;Link;TrackingURL;Note'];
  trs.filter(x => inR(x.date)).forEach(x =>
    lines.push(['TRANSFER', x.date, qq(x.sender), de2(x.amount), de2(x.tip||0), '', '', '', '', qq(x.note)].join(';')));
  buys.filter(b => inR(b.date)).forEach(b =>
    lines.push(['PURCHASE', b.date, qq(b.item), de2(-b.paid), '', d.st[b.status]||b.status,
      b.tracking_no||'', b.link||'', b.tracking_url||'', qq(b.note)].join(';')));
  if (lines.length < 2) return say(d.nothing, true);
  const u = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = u; a.download = 'auslagen.csv'; a.click();
  URL.revokeObjectURL(u);
  say(d.exported);
};
</script>
