<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auslagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Karla:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2420; --paper:#EDEFEA; --surface:#F7F8F4; --line:#C9CFC6;
    --muted:#68746C; --amber:#C0842A; --alert:#9E3423; --green:#3F6B4E;
    --sans:"Karla","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,sans-serif;
    --serif:"Instrument Serif","Noto Sans Arabic",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  [dir=rtl] body{font-family:"Noto Sans Arabic","Karla",sans-serif}
  [dir=rtl] .big,[dir=rtl] .split b,[dir=rtl] .row .d,[dir=rtl] .row .amt{font-family:"Noto Sans Arabic",var(--serif)}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 120px}
  h1{font-family:var(--serif);font-size:28px;font-weight:400;margin:0}
  [dir=rtl] h1{font-family:"Noto Sans Arabic",var(--serif);font-weight:500;font-size:24px}
  h1 span{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px;font-weight:400}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
  .who{font-size:12.5px;color:var(--muted);text-align:end}
  .who button{display:block;margin-inline-start:auto;margin-top:3px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12.5px;padding:0}

  .langs{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;width:fit-content;margin-bottom:20px}
  .langs button{font-family:inherit;font-size:12.5px;padding:5px 13px;background:none;border:none;cursor:pointer;color:var(--muted)}
  .langs button.on{background:var(--ink);color:var(--paper)}

  .gate{max-width:420px;margin:12vh auto;padding:0 20px}
  .gate p{font-size:14px;color:var(--muted);margin:0 0 16px;max-width:42ch}
  .banner{border:1px solid var(--amber);background:#FBF3E3;border-radius:4px;padding:11px 14px;font-size:13.5px;margin-bottom:18px}

  .balance{border:1.5px solid var(--ink);border-radius:4px;padding:20px;margin-bottom:14px;background:var(--surface)}
  .big{font-family:var(--serif);font-size:54px;line-height:1.05}
  .big.neg{color:var(--alert)}
  .cap{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:46ch}
  .split{display:flex;gap:24px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .split>div{font-size:13px;color:var(--muted)}
  .split b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink)}
  .split b.in{color:var(--green)}

  .filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px;font-size:13px;color:var(--muted)}
  .filter input{font-family:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  .chip{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .strip{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:22px;font-size:13.5px;color:var(--muted)}
  .track{flex:1;height:6px;background:#DDE1D9;border-radius:3px;overflow:hidden;min-width:60px}
  .track i{display:block;height:100%;background:var(--amber);transition:width .4s ease}
  .track.over i{background:var(--alert)}

  .tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:inherit;font-size:14.5px;background:none;border:none;padding:9px 13px;cursor:pointer;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
  .tab.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:5px;border-radius:9px;background:var(--amber);color:#fff;font-size:11.5px;line-height:18px;text-align:center;vertical-align:1px}

  h2{font-size:12.5px;font-weight:700;margin:20px 0 4px;color:var(--muted)}
  .row{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .row .d{font-family:var(--serif);font-size:15px;color:var(--muted);flex:none;width:50px;padding-top:2px}
  .row .b{flex:1;min-width:0}
  .row .t{font-weight:500;word-break:break-word}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
  .row .amt{font-family:var(--serif);font-size:19px;flex:none;text-align:end;min-width:74px}
  .row .amt small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);line-height:1.4}
  .row .amt.in{color:var(--green)}
  .row .amt.q{color:var(--muted);font-size:17px}
  .row.pend{background:#FBF6EC;margin-inline:-8px;padding-inline:8px;border-radius:3px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--muted);background:#fff;text-decoration:none;cursor:pointer;font-family:inherit}
  .tag.st{border-color:var(--amber);color:#8A5E18}
  .tag.st.done{border-color:var(--green);color:var(--green)}
  .tag.code{direction:ltr;unicode-bidi:embed}
  .tag.no{border-color:var(--alert);color:var(--alert)}
  .act{font-size:12.5px;font-family:inherit;border-radius:3px;padding:4px 10px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
  .act.sec{background:none;color:var(--ink)}
  .act.no{background:none;color:var(--alert);border-color:var(--alert)}
  select.mini{width:auto;font-size:12.5px;padding:3px 6px;font-family:inherit;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
  .empty{border:1px dashed var(--line);border-radius:4px;padding:26px;text-align:center;color:var(--muted);font-size:14.5px;margin-top:14px}
  .bar{display:flex;gap:9px;margin-top:24px;flex-wrap:wrap}
  .ghost{font-family:inherit;font-size:14px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer}
  .status{font-size:13px;color:var(--muted);margin-top:12px;min-height:19px}
  .status.err{color:var(--alert)}

  /* add button + sheet */
  .fab{position:fixed;inset-inline-end:20px;bottom:24px;width:56px;height:56px;border-radius:28px;border:none;
       background:var(--ink);color:var(--paper);font-size:30px;line-height:1;cursor:pointer;z-index:5;
       box-shadow:0 3px 14px rgba(27,36,32,.28)}
  .sheet{position:fixed;inset:0;background:rgba(27,36,32,.5);display:none;z-index:10;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .card{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
        border-radius:14px 14px 0 0;padding:20px 18px 32px}
  .card h3{font-family:var(--serif);font-size:23px;font-weight:400;margin:0 0 4px}
  [dir=rtl] .card h3{font-family:"Noto Sans Arabic",var(--serif);font-weight:500;font-size:20px}
  .card .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
  .pick{display:flex;flex-direction:column;gap:9px}
  .pick button{font-family:inherit;font-size:15.5px;text-align:start;padding:14px 16px;border:1px solid var(--line);
               background:var(--surface);border-radius:5px;cursor:pointer;color:var(--ink)}
  .pick button small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .full{grid-column:1/-1}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
  input,textarea,select{width:100%;font-family:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:44px}
  input[type=file]{font-size:13px;padding:6px;background:none;border-style:dashed}
  input[type=url],input[type=email],input[type=number]{direction:ltr;text-align:start}
  button.go{font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--ink);border-radius:3px;padding:11px 18px;background:var(--ink);color:var(--paper)}
  button.go[disabled]{opacity:.5}
  .cancel{background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:10px 4px}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .modal{position:fixed;inset:0;background:rgba(27,36,32,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:11}
  .modal.on{display:flex}
  .modal img{max-width:100%;max-height:86vh;border-radius:4px}
  .modal button{position:absolute;top:14px;inset-inline-end:18px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer}

  @media (max-width:520px){.grid{grid-template-columns:1fr}.big{font-size:42px}}
  @media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="langs" id="langsGate"></div>
  <h1>Auslagen<span id="gTag"></span></h1>
  <p id="gIntro"></p>
  <form id="fLogin">
    <label for="email" id="lEmail"></label>
    <input id="email" type="email" required autocomplete="email" placeholder="name@mail.com">
    <div style="margin-top:12px"><button class="go" type="submit" id="loginBtn"></button></div>
  </form>
  <div class="status" id="gateStatus" role="status"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>Auslagen<span id="aTag"></span></h1>
    <div class="who"><span id="me"></span><button id="out"></button></div>
  </div>

  <div class="langs" id="langsApp"></div>
  <div class="banner" id="viewerBanner" hidden></div>

  <section class="balance">
    <div class="big" id="bal">€0,00</div>
    <div class="cap" id="balcap"></div>
    <div class="split">
      <div><span id="lIn"></span><b class="in" id="sIn">€0</b></div>
      <div><span id="lOut"></span><b id="sOut">€0</b></div>
      <div><span id="lN"></span><b id="sN">0</b></div>
      <div><span id="lOpen"></span><b id="sOpen">0</b></div>
    </div>
  </section>

  <div class="filter">
    <span id="lPeriod"></span>
    <input type="date" id="from"><input type="date" id="to">
    <button class="chip" data-r="year"></button>
    <button class="chip" data-r="30"></button>
    <button class="chip" data-r="all"></button>
  </div>

  <div class="strip" id="tipStrip">
    <span><span id="lTip"></span> <span id="tipY"></span></span>
    <div class="track" id="track"><i id="tipbar" style="width:0"></i></div>
    <span id="tiptxt"></span>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="req" id="tabReq"></button>
    <button class="tab" data-t="buy" id="tabBuy"></button>
    <button class="tab" data-t="dlv" id="tabDlv"></button>
    <button class="tab" data-t="tr"  id="tabTr"></button>
  </div>

  <div id="listReq"></div>
  <div id="listBuy" hidden></div>
  <div id="listDlv" hidden></div>
  <div id="listTr"  hidden></div>

  <div class="bar"><button class="ghost" id="csv"></button></div>
  <div class="status" id="status" role="status"></div>
</div>

<button class="fab" id="fab" hidden aria-label="+">+</button>

<!-- add sheet -->
<div class="sheet" id="sheet">
  <div class="card">
    <h3 id="shTitle"></h3>
    <p class="sub" id="shSub"></p>

    <div class="pick" id="pick">
      <button data-f="req"  id="pkReq"></button>
      <button data-f="buy"  id="pkBuy"></button>
      <button data-f="dlv"  id="pkDlv"></button>
      <button data-f="tr"   id="pkTr"></button>
    </div>

    <form id="fReq" hidden>
      <div class="grid">
        <div class="full"><label for="r_item" id="lReqItem"></label><input id="r_item" required></div>
        <div class="full"><label for="r_link" id="lReqLink"></label><input id="r_link" type="url" placeholder="https://"></div>
        <div><label for="r_price" id="lEstPrice"></label><input id="r_price" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div><label for="r_pay" id="lEstPay"></label><input id="r_pay" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="full"><label for="r_note" id="lReqNote"></label><textarea id="r_note"></textarea></div>
        <div class="full"><button class="go" type="submit" id="rSave"></button><button type="button" class="cancel close"></button></div>
      </div>
    </form>

    <form id="fBuy" hidden>
      <div class="grid">
        <div class="full"><label for="b_item" id="lItem"></label><input id="b_item" required></div>
        <div><label for="b_date" id="lDate1"></label><input id="b_date" type="date" required></div>
        <div><label for="b_price" id="lProd"></label><input id="b_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div><label for="b_ship" id="lShip"></label><input id="b_ship" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div><label for="b_recv" id="lRecv"></label><input id="b_recv" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="full"><label for="b_link" id="lLink"></label><input id="b_link" type="url" placeholder="https://"></div>
        <div><label for="b_stat" id="lStat"></label><select id="b_stat"></select></div>
        <div><label for="b_track" id="lTrackNo"></label><input id="b_track"></div>
        <div class="full"><label for="b_turl" id="lTrackUrl"></label><input id="b_turl" type="url" placeholder="https://"></div>
        <div class="full"><label for="b_img" id="lShot"></label><input id="b_img" type="file" accept="image/*"></div>
        <div class="full"><label for="b_note" id="lNote1"></label><textarea id="b_note"></textarea></div>
        <div class="full"><button class="go" type="submit" id="bSave"></button><button type="button" class="cancel close"></button></div>
      </div>
    </form>

    <form id="fDlv" hidden>
      <div class="grid">
        <div><label for="d_date" id="lDate3"></label><input id="d_date" type="date" required></div>
        <div><label for="d_price" id="lDlvPrice"></label><input id="d_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div class="full"><label for="d_dest" id="lDest"></label><input id="d_dest" required></div>
        <div class="full"><label for="d_img" id="lDlvImg"></label><input id="d_img" type="file" accept="image/*"></div>
        <div class="full"><label for="d_note" id="lNote3"></label><textarea id="d_note"></textarea></div>
        <div class="full"><button class="go" type="submit" id="dSave"></button><button type="button" class="cancel close"></button></div>
      </div>
    </form>

    <form id="fTr" hidden>
      <div class="grid">
        <div><label for="t_name" id="lSender"></label><input id="t_name" required list="senders"><datalist id="senders"></datalist></div>
        <div><label for="t_date" id="lDate2"></label><input id="t_date" type="date" required></div>
        <div class="full"><label for="t_amt" id="lAmount"></label><input id="t_amt" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div class="full"><label for="t_img" id="lReceipt"></label><input id="t_img" type="file" accept="image/*"></div>
        <div class="full"><label for="t_note" id="lNote2"></label><textarea id="t_note"></textarea></div>
        <div class="full"><button class="go" type="submit" id="tSave"></button><button type="button" class="cancel close"></button></div>
      </div>
    </form>

    <form id="fBought" hidden>
      <div class="grid">
        <div><label for="k_price" id="lProd2"></label><input id="k_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div><label for="k_ship" id="lShip2"></label><input id="k_ship" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="full"><label for="k_recv" id="lRecv2"></label><input id="k_recv" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="full"><button class="go" type="submit" id="kSave"></button><button type="button" class="cancel close"></button></div>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="modal"><button id="mx" aria-label="×">×</button><img id="mimg" alt=""></div>

async function loadAll(){
  say(t('loading'));
  const [p,x,g]=await Promise.all([
    sb.from('purchases').select('*').order('date',{ascending:false}),
    sb.from('transfers').select('*').order('date',{ascending:false}),
    sb.from('deliveries').select('*').order('date',{ascending:false})
  ]);
  const err=p.error||x.error||g.error;
  if(err) return say(t('errLoad')+err.message,true);
  buys=p.data; trs=x.data; dlvs=g.data;
  say(''); render();
}

function shrink(file,max=1100,qual=.7){
  return new Promise(res=>{
    if(!file) return res(null);
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        c.toBlob(b=>res(b),'image/jpeg',qual);};
      im.onerror=()=>res(null); im.src=fr.result;};
    fr.onerror=()=>res(null); fr.readAsDataURL(file);
  });
}
async function upload(file){
  const blob=await shrink(file); if(!blob) return null;
  const path=`${uid}/${Date.now()}.jpg`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
  if(error){say(t('errImg')+error.message,true);return null;}
  return path;
}
async function showImg(path){
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,120);
  if(error) return say(t('errImgFind'),true);
  $('mimg').src=data.signedUrl; $('modal').classList.add('on');
}

/* ---------- render ---------- */
function group(rows,fn){
  let h='',m='';
  for(const r of rows){
    const lbl=new Date(r.date+'T12:00').toLocaleDateString(T[lang]._locale,{month:'long',year:'numeric'});
    if(lbl!==m){m=lbl;h+='<h2>'+lbl+'</h2>';}
    h+=fn(r);
  }
  return h;
}
function render(){
  const d=T[lang];
  const bought=buys.filter(isBought), queue=buys.filter(b=>!isBought(b));
  const openReq=buys.filter(b=>b.approval==='pending').length;
  const fb=bought.filter(b=>inR(b.date)), ft=trs.filter(x=>inR(x.date)), fd=dlvs.filter(x=>inR(x.date));

  const inn=ft.reduce((s,x)=>s+ +x.amount,0);
  const out=fb.reduce((s,b)=>s+cost(b),0)+fd.reduce((s,x)=>s+ +x.price,0);
  const bal=trs.reduce((s,x)=>s+ +x.amount,0)
          - bought.reduce((s,b)=>s+cost(b),0)
          - dlvs.reduce((s,x)=>s+ +x.price,0);

  $('bal').textContent=eur(bal); $('bal').className='big'+(bal<0?' neg':'');
  $('balcap').textContent=bal<0?d.balCapNeg:d.balCap;
  $('sIn').textContent=eur0(inn); $('sOut').textContent=eur0(out);
  $('sN').textContent=fb.length;
  $('sOpen').textContent=bought.filter(b=>b.status!=='handed'&&b.status!=='delivered').length;

  const y=(to||today()).slice(0,4);
  const tip=bought.filter(b=>b.date.slice(0,4)===y).reduce((s,b)=>s+extra(b),0);
  $('tipY').textContent=y;
  $('tipbar').style.width=Math.min(100,Math.max(0,tip)/LIMIT*100)+'%';
  $('track').classList.toggle('over',tip>LIMIT);
  $('tiptxt').textContent=tip>LIMIT?eur0(tip)+' — '+d.over:eur0(tip)+' '+d.ofLimit;

  $('tabReq').innerHTML=d.tabReq+(openReq?'<span class="badge">'+openReq+'</span>':'');
  $('senders').innerHTML=[...new Set(trs.map(x=>x.sender))].map(n=>'<option value="'+esc(n)+'">').join('');

  $('listReq').innerHTML = queue.length ? group(queue,b=>{
    const pend=b.approval==='pending', dec=b.approval==='declined';
    const chip = pend?'<span class="tag st">'+d.pending+'</span>'
               : dec ?'<span class="tag no">'+d.declined+'</span>'
                     :'<span class="tag st done">'+d.approved+' · '+d.notBought+'</span>';
    let acts='';
    if(!viewer&&pend) acts='<button class="act" data-ok="'+b.id+'">'+d.approve+'</button>'
                          +'<button class="act no" data-no="'+b.id+'">'+d.decline+'</button>';
    if(!viewer&&b.approval==='approved') acts='<button class="act sec" data-buy="'+b.id+'">'+d.markBought+'</button>';
    const canDrop=!viewer||(pend&&b.requested_by===uid);
    return '<div class="row'+(pend?' pend':'')+'"><div class="d">'+dd(b)+'</div><div class="b">'
      +'<div class="t">'+esc(b.item)+'</div>'
      +(b.note?'<div class="s">'+esc(b.note)+'</div>':'')
      +'<div class="tags">'+chip
      +(b.link?'<a class="tag" href="'+esc(b.link)+'" target="_blank" rel="noopener">'+d.product+'</a>':'')
      +acts+'</div></div>'
      +(hasQuote(b)?'<div class="amt q">'+eur(quoteTotal(b))+'<small>'+d.quoted+'</small></div>':'')
      +(canDrop?'<button class="del" data-del="purchases:'+b.id+'" data-path="">×</button>':'')
      +'</div>';
  }) : '<div class="empty">'+d.noReq+'</div>';

  $('listBuy').innerHTML = fb.length ? group(fb,b=>{
    const done=b.status==='handed'||b.status==='delivered';
    const stTag=viewer?'<span class="tag st'+(done?' done':'')+'">'+esc(d.st[b.status]||b.status)+'</span>'
      :'<select class="mini" data-st="'+b.id+'">'+STATUSES.map(s=>'<option value="'+s+'"'+(s===b.status?' selected':'')+'>'+d.st[s]+'</option>').join('')+'</select>';
    const ex=extra(b);
    return '<div class="row"><div class="d">'+dd(b)+'</div><div class="b">'
      +'<div class="t">'+esc(b.item)+'</div>'
      +'<div class="s">'+eur(nz(b.price))+(nz(b.shipping)?' + '+eur(nz(b.shipping))+' '+d.shipping:'')
        +(b.received!=null?' · '+eur(nz(b.received))+' '+d.recv.replace(' €',''):'')+'</div>'
      +(b.note?'<div class="s">'+esc(b.note)+'</div>':'')
      +'<div class="tags">'+stTag
      +(!viewer?'<button class="tag" data-edit="'+b.id+'">'+d.ship+'</button>':'')
      +(b.link?'<a class="tag" href="'+esc(b.link)+'" target="_blank" rel="noopener">'+d.product+'</a>':'')
      +(b.tracking_url?'<a class="tag" href="'+esc(b.tracking_url)+'" target="_blank" rel="noopener">'+d.tracking+'</a>':'')
      +(b.tracking_no?'<span class="tag code">'+esc(b.tracking_no)+'</span>':'')
      +(b.image_path?'<button class="tag" data-img="'+esc(b.image_path)+'">'+d.shotTag+'</button>':'')
      +'</div></div>'
      +'<div class="amt">'+eur(cost(b))+(b.received!=null?'<small>'+(ex>=0?'+':'')+eur(ex)+' '+d.extra+'</small>':'')+'</div>'
      +(viewer?'':'<button class="del" data-del="purchases:'+b.id+'" data-path="'+esc(b.image_path||'')+'">×</button>')
      +'</div>';
  }) : '<div class="empty">'+d.emptyBuy+'</div>';

  $('listDlv').innerHTML = fd.length ? group(fd,x=>
     '<div class="row"><div class="d">'+dd(x)+'</div><div class="b">'
    +'<div class="t">'+esc(x.destination||'')+'</div>'
    +(x.note?'<div class="s">'+esc(x.note)+'</div>':'')
    +(x.image_path?'<div class="tags"><button class="tag" data-img="'+esc(x.image_path)+'">'+d.receiptTag+'</button></div>':'')
    +'</div><div class="amt">'+eur(+x.price)+'</div>'
    +(viewer?'':'<button class="del" data-del="deliveries:'+x.id+'" data-path="'+esc(x.image_path||'')+'">×</button>')
    +'</div>'
  ) : '<div class="empty">'+d.emptyDlv+'</div>';

  $('listTr').innerHTML = ft.length ? group(ft,x=>
     '<div class="row"><div class="d">'+dd(x)+'</div><div class="b">'
    +'<div class="t">'+esc(x.sender)+'</div>'
    +(x.note?'<div class="s">'+esc(x.note)+'</div>':'')
    +(x.image_path?'<div class="tags"><button class="tag" data-img="'+esc(x.image_path)+'">'+d.receiptTag+'</button></div>':'')
    +'</div><div class="amt in">+'+eur(+x.amount)+'</div>'
    +(viewer?'':'<button class="del" data-del="transfers:'+x.id+'" data-path="'+esc(x.image_path||'')+'">×</button>')
    +'</div>'
  ) : '<div class="empty">'+d.emptyTr+'</div>';

  document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>showImg(b.dataset.img));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del,b.dataset.path));
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,'approved'));
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>decide(b.dataset.no,'declined'));
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>askBought(b.dataset.buy));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>askBought(b.dataset.edit,true));
  document.querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>setStatus(s.dataset.st,s.value));
}

/* ---------- actions ---------- */
async function decide(id,verdict){
  const {error}=await sb.from('purchases').update({approval:verdict}).eq('id',id);
  if(error) return say(t('errSave')+error.message,true);
  await loadAll(); say(verdict==='approved'?t('approvedMsg'):t('declinedMsg'));
}
function askBought(id,editing){
  const b=buys.find(x=>x.id===id); if(!b) return;
  boughtId=id;
  $('k_price').value = b.price!=null?b.price:(b.est_price!=null?b.est_price:'');
  $('k_ship').value  = b.shipping!=null?b.shipping:'';
  $('k_recv').value  = b.received!=null?b.received:(b.est_payment!=null?b.est_payment:'');
  openSheet('fBought');
}
$('fBought').onsubmit=async e=>{
  e.preventDefault();
  const price=numv($('k_price').value), ship=$('k_ship').value?numv($('k_ship').value):null;
  const recv=$('k_recv').value?numv($('k_recv').value):null;
  const b=buys.find(x=>x.id===boughtId);
  const patch={price,shipping:ship,received:recv,paid:price+(ship||0)};
  if(!isBought(b)){ patch.status='ordered'; patch.date=today(); }
  const {error}=await sb.from('purchases').update(patch).eq('id',boughtId);
  if(error) return say(t('errSave')+error.message,true);
  closeSheet(); await loadAll(); say(t('boughtMsg'));
};
async function setStatus(id,status){
  const {error}=await sb.from('purchases').update({status}).eq('id',id);
  if(error) return say(t('errSave')+error.message,true);
  await loadAll(); say(t('statusChanged'));
}
async function del(ref,path){
  const [table,id]=ref.split(':');
  if(!confirm(t('confirmDel'))) return;
  if(path) await sb.storage.from(BUCKET).remove([path]);
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error) return say(t('errDel')+error.message,true);
  await loadAll(); say(t('deleted'));
}

/* ---------- forms ---------- */
$('fReq').onsubmit=async e=>{
  e.preventDefault(); $('rSave').disabled=true;
  const {error}=await sb.from('purchases').insert({
    user_id:ownerId, requested_by:uid, approval:'pending', paid:null,
    date:today(), status:'ordered', item:$('r_item').value.trim(),
    link:$('r_link').value.trim()||null,
    est_price:$('r_price').value?numv($('r_price').value):null,
    est_payment:$('r_pay').value?numv($('r_pay').value):null,
    note:$('r_note').value.trim()||null
  });
  $('rSave').disabled=false;
  if(error) return say(t('errSave')+error.message,true);
  $('fReq').reset(); applyLang(); closeSheet(); await loadAll(); say(t('reqSent'));
};
$('fBuy').onsubmit=async e=>{
  e.preventDefault(); $('bSave').disabled=true; say(t('saving'));
  const image_path=await upload($('b_img').files[0]);
  const price=numv($('b_price').value), ship=$('b_ship').value?numv($('b_ship').value):null;
  const {error}=await sb.from('purchases').insert({
    date:$('b_date').value, item:$('b_item').value.trim(), approval:'approved',
    price, shipping:ship, received:$('b_recv').value?numv($('b_recv').value):null,
    paid:price+(ship||0), link:$('b_link').value.trim()||null, status:$('b_stat').value,
    tracking_no:$('b_track').value.trim()||null, tracking_url:$('b_turl').value.trim()||null,
    image_path, note:$('b_note').value.trim()||null
  });
  $('bSave').disabled=false;
  if(error) return say(t('errSave')+error.message,true);
  $('fBuy').reset(); applyLang(); $('b_date').value=today(); closeSheet(); await loadAll(); say(t('savedBuy'));
};
$('fDlv').onsubmit=async e=>{
  e.preventDefault(); $('dSave').disabled=true; say(t('saving'));
  const image_path=await upload($('d_img').files[0]);
  const {error}=await sb.from('deliveries').insert({
    date:$('d_date').value, price:numv($('d_price').value),
    destination:$('d_dest').value.trim(), image_path, note:$('d_note').value.trim()||null
  });
  $('dSave').disabled=false;
  if(error) return say(t('errSave')+error.message,true);
  $('fDlv').reset(); applyLang(); $('d_date').value=today(); closeSheet(); await loadAll(); say(t('savedDlv'));
};
$('fTr').onsubmit=async e=>{
  e.preventDefault(); $('tSave').disabled=true; say(t('saving'));
  const image_path=await upload($('t_img').files[0]);
  const {error}=await sb.from('transfers').insert({
    date:$('t_date').value, sender:$('t_name').value.trim(), amount:numv($('t_amt').value),
    tip:0, image_path, note:$('t_note').value.trim()||null
  });
  $('tSave').disabled=false;
  if(error) return say(t('errSave')+error.message,true);
  $('fTr').reset(); applyLang(); $('t_date').value=today(); closeSheet(); await loadAll(); say(t('savedTr'));
};

/* ---------- tabs, filters, export ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('listReq').hidden=tab!=='req'; $('listBuy').hidden=tab!=='buy';
  $('listDlv').hidden=tab!=='dlv'; $('listTr').hidden=tab!=='tr';
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  const n=new Date(), iso=x=>x.toISOString().slice(0,10);
  if(c.dataset.r==='year'){from=n.getFullYear()+'-01-01';to=iso(n);}
  else if(c.dataset.r==='30'){const x=new Date(n);x.setDate(x.getDate()-30);from=iso(x);to=iso(n);}
  else {from='';to='';}
  $('from').value=from; $('to').value=to;
  if(uid) render();
});
$('from').onchange=e=>{from=e.target.value;render()};
$('to').onchange=e=>{to=e.target.value;render()};

$('csv').onclick=()=>{
  const d=T[lang];
  const L=['TYPE;Date;Name;Price;Shipping;Received;Extra;Status;TrackingNo;Link;Note'];
  trs.filter(x=>inR(x.date)).forEach(x=>
    L.push(['TRANSFER',x.date,qq(x.sender),'','',de2(+x.amount),'','','','',qq(x.note)].join(';')));
  buys.filter(b=>isBought(b)&&inR(b.date)).forEach(b=>
    L.push(['PURCHASE',b.date,qq(b.item),de2(nz(b.price)),de2(nz(b.shipping)),
      b.received!=null?de2(nz(b.received)):'', b.received!=null?de2(extra(b)):'',
      d.st[b.status]||b.status,b.tracking_no||'',b.link||'',qq(b.note)].join(';')));
  dlvs.filter(x=>inR(x.date)).forEach(x=>
    L.push(['SHIPPING',x.date,qq(x.destination),'',de2(+x.price),'','','','','',qq(x.note)].join(';')));
  if(L.length<2) return say(d.nothing,true);
  const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=u; a.download='auslagen.csv'; a.click();
  URL.revokeObjectURL(u); say(d.exported);
};
</script>
