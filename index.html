<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auslagen</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E1412">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1412; --card:#18211D; --card2:#1C2621; --line:#242E29;
    --txt:#E8EDE9; --dim:#7C8A84; --lime:#D7F25B; --limeInk:#141E06;
    --amberBg:#3A3118; --amberTx:#E8C86A;
    --greenBg:#1B3327; --greenTx:#8FD9AC;
    --redBg:#3A1E1B;  --redTx:#F0A79B;
    --sans:"Manrope","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:14px 16px 110px}

  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .kicker{font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .hello{font-size:15px;margin-top:2px}
  .icons{display:flex;gap:8px}
  .ibtn{width:36px;height:36px;border-radius:18px;background:var(--card2);border:none;color:var(--txt);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ibtn.on{background:var(--lime);color:var(--limeInk)}

  .langs{display:flex;gap:4px;margin-bottom:14px}
  .langs button{font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--card);border:none;color:var(--dim);cursor:pointer}
  .langs button.on{background:var(--lime);color:var(--limeInk);font-weight:600}

  .banner{background:var(--amberBg);color:var(--amberTx);border-radius:14px;padding:11px 14px;font-size:12.5px;margin-bottom:14px}

  .hero{background:var(--lime);border-radius:22px;padding:18px}
  .hero .lab{font-size:11px;color:#3C4A12}
  .hero .amt{font-size:40px;color:var(--limeInk);line-height:1.1;letter-spacing:-.02em;margin-top:2px;font-weight:600}
  .hero .amt small{font-size:22px;font-weight:500}
  .hero .grid{display:flex;gap:8px;margin-top:14px}
  .hero .grid div{flex:1;background:rgba(20,30,6,.10);border-radius:13px;padding:9px 11px}
  .hero .grid span{display:block;font-size:9.5px;color:#3C4A12}
  .hero .grid b{font-size:15px;color:var(--limeInk);font-weight:600}

  .secrow{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
  .secrow h2{font-size:15px;margin:0;font-weight:600}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:none;background:var(--card);border-radius:20px;padding:6px 13px;font-size:11.5px;color:var(--dim);font-family:inherit;cursor:pointer}
  .chip.on{background:var(--card2);color:var(--txt)}
  .dates{display:flex;gap:6px;margin-bottom:12px}
  .dates input{flex:1;font-family:inherit;font-size:12px;padding:8px 10px;border-radius:12px;border:none;background:var(--card);color:var(--txt)}

  .item{background:var(--card);border-radius:18px;padding:13px;display:flex;gap:12px;align-items:center;margin-bottom:9px;cursor:pointer}
  .tile{width:40px;height:40px;border-radius:13px;background:var(--card2);color:var(--lime);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;font-weight:600}
  .mid{flex:1;min-width:0}
  .nm{font-size:13.5px;font-weight:500;word-break:break-word}
  .sub{font-size:10.5px;color:var(--dim);margin-top:3px;word-break:break-word}
  .pill{display:inline-block;margin-top:7px;margin-right:5px;border-radius:20px;padding:3px 10px;font-size:9.5px;background:var(--card2);color:var(--dim)}
  .pill.w{background:var(--amberBg);color:var(--amberTx)}
  .pill.g{background:var(--greenBg);color:var(--greenTx)}
  .pill.r{background:var(--redBg);color:var(--redTx)}
  .pill.l{background:var(--lime);color:var(--limeInk);font-weight:600}
  .val{font-size:15px;font-weight:600;text-align:end;flex:none}
  .val.in{color:var(--lime)}
  .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .act{font-family:inherit;font-size:11.5px;border-radius:20px;padding:6px 13px;border:none;cursor:pointer;background:var(--lime);color:var(--limeInk);font-weight:600}
  .act.ghost{background:var(--card2);color:var(--txt);font-weight:400}
  .act.bad{background:var(--redBg);color:var(--redTx)}
  .mono{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed}

  .empty{border:1px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;color:var(--dim);font-size:13px}
  .month{font-size:10.5px;color:var(--dim);margin:16px 2px 8px;letter-spacing:.04em}
  .note{font-size:12px;color:var(--dim);margin-top:12px;min-height:18px}
  .note.err{color:var(--redTx)}

  nav{position:fixed;left:0;right:0;bottom:0;background:#121A17;border-top:1px solid var(--line);
      display:flex;justify-content:space-around;align-items:center;padding:9px 4px calc(12px + env(safe-area-inset-bottom));z-index:6}
  nav button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:9.5px;cursor:pointer;
             display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 6px;position:relative;min-width:52px}
  nav button.on{color:var(--lime)}
  nav .ico{font-size:19px;line-height:1}
  nav .fab{width:46px;height:46px;border-radius:23px;background:var(--lime);color:var(--limeInk);font-size:24px;
           display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
  nav .dot{position:absolute;top:-2px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--lime);
           color:var(--limeInk);font-size:9px;line-height:16px;font-weight:700;padding:0 4px}

  .sheet{position:fixed;inset:0;background:rgba(6,10,9,.72);display:none;z-index:20;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .card{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;
        padding:18px 16px calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .card h3{font-size:18px;margin:0 0 14px;font-weight:600}
  .pick{display:flex;flex-direction:column;gap:9px}
  .pick button{font-family:inherit;font-size:14.5px;text-align:start;padding:15px 16px;border:none;background:var(--card);
               border-radius:16px;cursor:pointer;color:var(--txt);display:flex;gap:12px;align-items:center}
  .pick button i{width:38px;height:38px;border-radius:12px;background:var(--card2);color:var(--lime);display:flex;
                 align-items:center;justify-content:center;flex:none;font-style:normal;font-size:17px}
  .pick small{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px}
  input,textarea,select{width:100%;font-family:inherit;font-size:16px;padding:12px;border:none;border-radius:13px;
                        background:var(--card);color:var(--txt)}
  textarea{resize:vertical;min-height:52px}
  select{appearance:none}
  input[type=file]{font-size:12px;padding:11px;background:var(--card);color:var(--dim)}
  input[type=url],input[type=email],input[type=number]{direction:ltr;text-align:start}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--lime);outline-offset:-2px}
  .go{width:100%;font-family:inherit;font-size:15px;font-weight:600;padding:14px;border:none;border-radius:14px;
      background:var(--lime);color:var(--limeInk);cursor:pointer;margin-top:4px}
  .go[disabled]{opacity:.5}
  .ghostbtn{width:100%;background:none;border:none;color:var(--dim);font-family:inherit;font-size:13px;padding:12px;cursor:pointer}
  .danger{width:100%;background:var(--redBg);border:none;color:var(--redTx);font-family:inherit;font-size:13px;
          padding:12px;border-radius:13px;cursor:pointer;margin-top:8px}

  .gate{max-width:380px;margin:14vh auto;padding:0 22px}
  .gate h1{font-size:30px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
  .gate p{font-size:13.5px;color:var(--dim);margin:0 0 18px}

  .viewer{position:fixed;inset:0;background:rgba(6,10,9,.9);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
  .viewer.on{display:flex}
  .viewer img{max-width:100%;max-height:85vh;border-radius:16px}
  .viewer button{position:absolute;top:16px;inset-inline-end:18px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer}
  [dir=rtl] body{font-family:"Noto Sans Arabic","Manrope",sans-serif}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <div class="langs" id="langsGate"></div>
  <h1>Auslagen</h1>
  <p id="gIntro"></p>
  <form id="fLogin">
    <label for="email" id="lEmail"></label>
    <input id="email" type="email" required autocomplete="email" placeholder="name@mail.com">
    <button class="go" type="submit" id="loginBtn" style="margin-top:12px"></button>
  </form>
  <div class="note" id="gateNote" role="status"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="head">
    <div>
      <div class="kicker" id="kicker"></div>
      <div class="hello" id="me"></div>
    </div>
    <div class="icons">
      <button class="ibtn" id="bell" aria-label="bell">&#9679;</button>
      <button class="ibtn" id="out" aria-label="out">&#8594;</button>
    </div>
  </div>

  <div class="langs" id="langsApp"></div>
  <div class="banner" id="viewerBanner" hidden></div>

  <section class="hero">
    <div class="lab" id="heroLab"></div>
    <div class="amt" id="bal">€0</div>
    <div class="grid">
      <div><span id="lIn"></span><b id="sIn">€0</b></div>
      <div><span id="lOut"></span><b id="sOut">€0</b></div>
    </div>
  </section>

  <div class="secrow"><h2 id="secTitle"></h2></div>
  <div class="filters">
    <button class="chip on" data-r="year"></button>
    <button class="chip" data-r="30"></button>
    <button class="chip" data-r="all"></button>
  </div>
  <div class="dates"><input type="date" id="from"><input type="date" id="to"></div>

  <div id="list"></div>
  <button class="ghostbtn" id="csv" style="margin-top:18px"></button>
  <div class="note" id="note" role="status"></div>
</div>

<nav id="nav" hidden>
  <button data-t="buy" class="on"><span class="ico">&#9636;</span><span id="nBuy"></span></button>
  <button data-t="req"><span class="ico">&#9744;</span><span id="nReq"></span><span class="dot" id="reqDot" hidden>0</span></button>
  <button class="fab" id="fab" aria-label="+">+</button>
  <button data-t="dlv"><span class="ico">&#9660;</span><span id="nDlv"></span></button>
  <button data-t="tr"><span class="ico">&#8645;</span><span id="nTr"></span></button>
</nav>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"></div>
    <h3 id="shTitle"></h3>

    <div class="pick" id="pick">
      <button data-f="fReq"><i>&#9744;</i><span id="pkReq"></span></button>
      <button data-f="fBuy"><i>&#9636;</i><span id="pkBuy"></span></button>
      <button data-f="fDlv"><i>&#9660;</i><span id="pkDlv"></span></button>
      <button data-f="fTr"><i>&#8645;</i><span id="pkTr"></span></button>
    </div>

    <form id="fReq" hidden>
      <div class="grid2">
        <div class="full"><label for="r_item" id="lReqItem"></label><input id="r_item" required></div>
        <div class="full"><label for="r_link" id="lReqLink"></label><input id="r_link" type="url" placeholder="https://"></div>
        <div><label for="r_price" id="lEstPrice"></label><input id="r_price" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div><label for="r_pay" id="lEstPay"></label><input id="r_pay" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div class="full"><label for="r_note" id="lReqNote"></label><textarea id="r_note"></textarea></div>
      </div>
      <button class="go" type="submit" id="rSave"></button>
      <button type="button" class="ghostbtn close"></button>
    </form>

    <form id="fBuy" hidden>
      <div class="grid2">
        <div class="full"><label for="b_item" id="lItem"></label><input id="b_item" required></div>
        <div><label for="b_date" id="lDate1"></label><input id="b_date" type="date" required></div>
        <div><label for="b_price" id="lProd"></label><input id="b_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div><label for="b_ship" id="lShip"></label><input id="b_ship" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <div><label for="b_stat" id="lStat"></label><select id="b_stat"></select></div>
        <div class="full"><label for="b_link" id="lLink"></label><input id="b_link" type="url" placeholder="https://"></div>
        <div class="full"><label for="b_track" id="lTrackNo"></label><input id="b_track" placeholder="00340434…"></div>
        <div class="full"><label for="b_turl" id="lTrackUrl"></label><input id="b_turl" type="url" placeholder="https://"></div>
        <div class="full"><label for="b_img" id="lShot"></label><input id="b_img" type="file" accept="image/*"></div>
        <div class="full"><label for="b_note" id="lNote1"></label><textarea id="b_note"></textarea></div>
      </div>
      <button class="go" type="submit" id="bSave"></button>
      <button type="button" class="danger" id="bDel" hidden></button>
      <button type="button" class="ghostbtn close"></button>
    </form>

    <form id="fDlv" hidden>
      <div class="grid2">
        <div><label for="d_date" id="lDate3"></label><input id="d_date" type="date" required></div>
        <div><label for="d_price" id="lDlvPrice"></label><input id="d_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div class="full"><label for="d_dest" id="lDest"></label><input id="d_dest" required></div>
        <div class="full"><label for="d_track" id="lTrackNo2"></label><input id="d_track" placeholder="00340434…"></div>
        <div class="full"><label for="d_turl" id="lTrackUrl2"></label><input id="d_turl" type="url" placeholder="https://"></div>
        <div class="full"><label for="d_img" id="lDlvImg"></label><input id="d_img" type="file" accept="image/*"></div>
        <div class="full"><label for="d_note" id="lNote3"></label><textarea id="d_note"></textarea></div>
      </div>
      <button class="go" type="submit" id="dSave"></button>
      <button type="button" class="danger" id="dDel" hidden></button>
      <button type="button" class="ghostbtn close"></button>
    </form>

    <form id="fTr" hidden>
      <div class="grid2">
        <div><label for="t_name" id="lSender"></label><input id="t_name" required list="senders"><datalist id="senders"></datalist></div>
        <div><label for="t_date" id="lDate2"></label><input id="t_date" type="date" required></div>
        <div class="full"><label for="t_amt" id="lAmount"></label><input id="t_amt" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div class="full"><label for="t_img" id="lReceipt"></label><input id="t_img" type="file" accept="image/*"></div>
        <div class="full"><label for="t_note" id="lNote2"></label><textarea id="t_note"></textarea></div>
      </div>
      <button class="go" type="submit" id="tSave"></button>
      <button type="button" class="danger" id="tDel" hidden></button>
      <button type="button" class="ghostbtn close"></button>
    </form>

    <form id="fBought" hidden>
      <div class="grid2">
        <div><label for="k_price" id="lProd2"></label><input id="k_price" type="number" step="0.01" min="0" required placeholder="0.00"></div>
        <div><label for="k_ship" id="lShip2"></label><input id="k_ship" type="number" step="0.01" min="0" placeholder="0.00"></div>
      </div>
      <button class="go" type="submit" id="kSave"></button>
      <button type="button" class="ghostbtn close"></button>
    </form>
  </div>
</div>

<div class="viewer" id="viewer"><button id="vx" aria-label="x">&times;</button><img id="vimg" alt=""></div>

async function loadAll(){
  say(t('loading'));
  const [p,x,g]=await Promise.all([
    sb.from('purchases').select('*').order('date',{ascending:false}),
    sb.from('transfers').select('*').order('date',{ascending:false}),
    sb.from('deliveries').select('*').order('date',{ascending:false})
  ]);
  const err=p.error||x.error||g.error;
  if(err) return say(t('errLoad')+err.message,true);
  buys=p.data; trs=x.data; dlvs=g.data;
  say(''); render();
}
function shrink(file,max=1100,q=.7){
  return new Promise(res=>{ if(!file) return res(null);
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); c.toBlob(b=>res(b),'image/jpeg',q)};
      im.onerror=()=>res(null); im.src=fr.result};
    fr.onerror=()=>res(null); fr.readAsDataURL(file)});
}
async function upload(file){
  const blob=await shrink(file); if(!blob) return null;
  const path=`${uid}/${Date.now()}.jpg`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
  if(error){say(t('errImg')+error.message,true); return null}
  return path;
}
async function showImg(path){
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,120);
  if(error) return say(t('errImgFind'),true);
  $('vimg').src=data.signedUrl; $('viewer').classList.add('on');
}

/* ---------- render ---------- */
function render(){
  const d=T[lang];
  const bought=buys.filter(isBought), queue=buys.filter(b=>!isBought(b));
  const openReq=buys.filter(b=>b.approval==='pending').length;
  const fb=bought.filter(b=>inR(b.date)), ft=trs.filter(x=>inR(x.date)), fd=dlvs.filter(x=>inR(x.date));

  const inn=ft.reduce((s,x)=>s+ +x.amount,0);
  const out=fb.reduce((s,b)=>s+cost(b),0)+fd.reduce((s,x)=>s+ +x.price,0);
  const bal=trs.reduce((s,x)=>s+ +x.amount,0)-bought.reduce((s,b)=>s+cost(b),0)-dlvs.reduce((s,x)=>s+ +x.price,0);

  const whole=Math.trunc(Math.abs(bal)), cents=Math.round((Math.abs(bal)-whole)*100);
  $('bal').innerHTML=(bal<0?'−':'')+'€'+whole.toLocaleString(T[lang]._l)+'<small>,'+String(cents).padStart(2,'0')+'</small>';
  $('heroLab').textContent = bal<0 ? d.heroNeg : d.heroLab;
  $('sIn').textContent=eur0(inn); $('sOut').textContent=eur0(out);
  $('reqDot').hidden=!openReq; $('reqDot').textContent=openReq;
  $('senders').innerHTML=[...new Set(trs.map(x=>x.sender))].map(n=>'<option value="'+esc(n)+'">').join('');
  $('secTitle').textContent=d['sec'+tab.charAt(0).toUpperCase()+tab.slice(1)];

  let html='';
  if(tab==='req'){
    html = queue.length ? queue.map(b=>{
      const pend=b.approval==='pending', dec=b.approval==='declined';
      const chip = pend?'<span class="pill w">'+d.pending+'</span>'
                 : dec ?'<span class="pill r">'+d.declined+'</span>'
                       :'<span class="pill g">'+d.approved+' · '+d.notBought+'</span>';
      let acts='';
      if(!viewer&&pend) acts='<div class="acts"><button class="act" data-ok="'+b.id+'">'+d.approve+'</button>'
        +'<button class="act bad" data-no="'+b.id+'">'+d.decline+'</button></div>';
      if(!viewer&&b.approval==='approved') acts='<div class="acts"><button class="act" data-buy="'+b.id+'">'+d.markBought+'</button></div>';
      const q=nz(b.est_payment)||nz(b.est_price);
      return '<div class="item"><span class="tile">'+esc(initials(b.item))+'</span><div class="mid">'
        +'<div class="nm">'+esc(b.item)+'</div>'
        +'<div class="sub">'+dayLbl(b)+(b.note?' · '+esc(b.note):'')+'</div>'
        +chip
        +(b.link?'<a class="pill" href="'+esc(b.link)+'" target="_blank" rel="noopener">'+d.product+'</a>':'')
        +acts+'</div>'
        +(q?'<div class="val">'+eur0(q)+'</div>':'')+'</div>';
    }).join('') : '<div class="empty">'+d.emptyReq+'</div>';
  }
  else if(tab==='buy'){
    html = fb.length ? group(fb, b=>{
      const done=b.status==='handed'||b.status==='delivered';
      return '<div class="item" data-edit="buy:'+b.id+'"><span class="tile">'+esc(initials(b.item))+'</span><div class="mid">'
        +'<div class="nm">'+esc(b.item)+'</div>'
        +'<div class="sub">'+dayLbl(b)+' · '+eur(nz(b.price))+(nz(b.shipping)?' + '+eur(nz(b.shipping)):'')+'</div>'
        +'<span class="pill '+(done?'g':'w')+'">'+esc(d.st[b.status]||b.status)+'</span>'
        +(b.tracking_no?'<span class="pill mono">'+esc(b.tracking_no)+'</span>':'')
        +(b.image_path?'<span class="pill" data-img="'+esc(b.image_path)+'">'+d.beleg+'</span>':'')
        +'</div><div class="val">'+eur(cost(b))+'</div></div>';
    }) : '<div class="empty">'+d.emptyBuy+'</div>';
  }
  else if(tab==='dlv'){
    html = fd.length ? group(fd, x=>
      '<div class="item" data-edit="dlv:'+x.id+'"><span class="tile">&#9660;</span><div class="mid">'
      +'<div class="nm">'+esc(x.destination||'')+'</div>'
      +'<div class="sub">'+dayLbl(x)+(x.note?' · '+esc(x.note):'')+'</div>'
      +(x.tracking_no?'<span class="pill mono">'+esc(x.tracking_no)+'</span>':'')
      +(x.image_path?'<span class="pill" data-img="'+esc(x.image_path)+'">'+d.beleg+'</span>':'')
      +'</div><div class="val">'+eur(+x.price)+'</div></div>'
    ) : '<div class="empty">'+d.emptyDlv+'</div>';
  }
  else {
    html = ft.length ? group(ft, x=>
      '<div class="item" data-edit="tr:'+x.id+'"><span class="tile">'+esc(initials(x.sender))+'</span><div class="mid">'
      +'<div class="nm">'+esc(x.sender)+'</div>'
      +'<div class="sub">'+dayLbl(x)+(x.note?' · '+esc(x.note):'')+'</div>'
      +(x.image_path?'<span class="pill" data-img="'+esc(x.image_path)+'">'+d.beleg+'</span>':'')
      +'</div><div class="val in">+'+eur(+x.amount)+'</div></div>'
    ) : '<div class="empty">'+d.emptyTr+'</div>';
  }
  $('list').innerHTML=html;

  document.querySelectorAll('[data-img]').forEach(b=>b.onclick=e=>{e.stopPropagation();showImg(b.dataset.img)});
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=e=>{e.stopPropagation();decide(b.dataset.ok,'approved')});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=e=>{e.stopPropagation();decide(b.dataset.no,'declined')});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{e.stopPropagation();askBought(b.dataset.buy)});
  if(!viewer) document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));
}
function group(rows,fn){
  let h='',m='';
  for(const r of rows){
    const lbl=new Date(r.date+'T12:00').toLocaleDateString(T[lang]._l,{month:'long',year:'numeric'});
    if(lbl!==m){m=lbl;h+='<div class="month">'+lbl+'</div>'}
    h+=fn(r);
  } return h;
}

    $('b_ship').value=b.shipping??''; $('b_stat').value=b.status||'ordered';

    $('b_turl').value=b.tracking_url||''; $('b_note').value=b.note||'';
    $('bDel').hidden=false; openSheet('fBuy',T[lang].editBuy);
  } else if(kind==='dlv'){
    const x=dlvs.find(y=>y.id===id); if(!x) return;
    $('d_date').value=x.date; $('d_price').value=x.price??''; $('d_dest').value=x.destination||'';
    $('d_track').value=x.tracking_no||''; $('d_turl').value=x.tracking_url||''; $('d_note').value=x.note||'';
    $('dDel').hidden=false; openSheet('fDlv',T[lang].editDlv);
  } else {
    const x=trs.find(y=>y.id===id); if(!x) return;
    $('t_name').value=x.sender||''; $('t_date').value=x.date; $('t_amt').value=x.amount??'';
    $('t_note').value=x.note||'';
    $('tDel').hidden=false; openSheet('fTr',T[lang].editTr);
  }
}

async function wipe(table,id,path){
  if(!confirm(t('confirmDel'))) return;
  if(path) await sb.storage.from(BUCKET).remove([path]);
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error) return say(t('errDel')+error.message,true);
  closeSheet(); await loadAll(); say(t('deleted'));
}
$('bDel').onclick=()=>{const b=buys.find(x=>x.id===editId); wipe('purchases',editId,b&&b.image_path)};
$('dDel').onclick=()=>{const x=dlvs.find(y=>y.id===editId); wipe('deliveries',editId,x&&x.image_path)};
$('tDel').onclick=()=>{const x=trs.find(y=>y.id===editId); wipe('transfers',editId,x&&x.image_path)};

  if(error) return say(t('errSave')+error.message,true);

  boughtId=id;
  $('k_price').value=b.est_price??''; $('k_ship').value='';

/* ---------- notifications ---------- */
const VAPID_PUBLIC='BJxYqLbmKYoidjuNdy0f7mojC2LPFTfXozlmtfv6eA_cC3QMegsOSvg0j0xNAytZxp8S8zv5kagHcMjmTEIp0bE';
const canNotify=()=>typeof Notification!=='undefined'&&Notification.permission==='granted';
function urlB64(s){
  const pad='='.repeat((4-s.length%4)%4);
  const raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function subscribePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!canNotify()) return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,
      applicationServerKey:urlB64(VAPID_PUBLIC)});
    const j=sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      user_id:uid, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, lang
    },{onConflict:'endpoint'});
  }catch(e){ console.warn('push subscribe failed',e); }
}
$('bell').onclick=async()=>{
  if(typeof Notification==='undefined') return;
  if(Notification.permission!=='granted') await Notification.requestPermission();
  applyLang(); if(canNotify()){ ping(t('notifyOn'),''); subscribePush(); }
};
function ping(title,body){
  if(!canNotify()) return;
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,
        {body,icon:'./icon-192.png',badge:'./icon-192.png',tag:'auslagen',renotify:true}))
        .catch(()=>new Notification(title,{body}));
    else new Notification(title,{body});
  }catch{}
}
function watch(){
  sb.channel('auslagen-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'purchases'},p=>{
      const r=p.new;
      if(!viewer&&r.approval==='pending'&&r.requested_by!==uid) ping(t('nNewReq'),r.item||'');
      if(viewer&&r.approval==='approved') ping(t('nNewBuy'),r.item||'');
      loadAll();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'purchases'},p=>{
      const r=p.new,o=p.old||{};
      if(viewer&&r.requested_by===uid&&o.approval==='pending'&&r.approval!=='pending')
        ping(t('nDecided'),r.item||'');
      if(viewer&&o.paid==null&&r.paid!=null) ping(t('nNewBuy'),r.item||'');
      if(viewer&&o.status&&r.status&&o.status!==r.status)
        ping(t('nStatus'),(r.item||'')+' · '+(T[lang].st[r.status]||r.status));
      loadAll();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'deliveries'},p=>{
      if(viewer) ping(t('nShip'),p.new.destination||'');
      loadAll();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'deliveries'},()=>loadAll())
    .subscribe();
}

/* ---------- nav, filters, export ---------- */
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('nav button[data-t]').forEach(x=>x.classList.toggle('on',x===b));
  render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  const n=new Date(), iso=x=>x.toISOString().slice(0,10);
  if(c.dataset.r==='year'){from=n.getFullYear()+'-01-01';to=iso(n)}
  else if(c.dataset.r==='30'){const x=new Date(n);x.setDate(x.getDate()-30);from=iso(x);to=iso(n)}
  else {from='';to=''}
  $('from').value=from; $('to').value=to; if(uid) render();
});
$('from').onchange=e=>{from=e.target.value;render()};
$('to').onchange=e=>{to=e.target.value;render()};

$('csv').onclick=()=>{
  const d=T[lang], de2=n=>n.toFixed(2).replace('.',','), q=s=>'"'+(s||'').replace(/"/g,'""')+'"';
  const L=['TYPE;Date;Name;Price;Shipping;Total;Status;TrackingNo;Link;Note'];
  trs.filter(x=>inR(x.date)).forEach(x=>L.push(['TRANSFER',x.date,q(x.sender),'','',de2(+x.amount),'','','',q(x.note)].join(';')));
  buys.filter(b=>isBought(b)&&inR(b.date)).forEach(b=>L.push(['PURCHASE',b.date,q(b.item),de2(nz(b.price)),
    de2(nz(b.shipping)),de2(-cost(b)),d.st[b.status]||b.status,b.tracking_no||'',b.link||'',q(b.note)].join(';')));
  dlvs.filter(x=>inR(x.date)).forEach(x=>L.push(['SHIPPING',x.date,q(x.destination),'',de2(+x.price),
    de2(-x.price),'',x.tracking_no||'','',q(x.note)].join(';')));
  if(L.length<2) return say(d.nothing,true);
  const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=u; a.download='auslagen.csv'; a.click();
  URL.revokeObjectURL(u); say(d.exported);
};
