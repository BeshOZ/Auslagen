name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SITE: https://beshoz.github.io/Auslagen
      PKG: de.auslagen.app
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'auslagen' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore or create keystore
        id: keys
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore.jks" \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Auslagen, OU=personal, O=personal, L=Nuernberg, C=DE"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -v -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -storepass "$KS_PASS" -alias android \
            | grep "SHA256:" | head -1 > "$GITHUB_WORKSPACE/fingerprint.txt"
          cat "$GITHUB_WORKSPACE/fingerprint.txt"

      - name: Write TWA manifest
        run: |
          mkdir -p twa
          cat > twa/twa-manifest.json << 'EOF'
          {
            "packageId": "de.auslagen.app",
            "host": "beshoz.github.io",
            "name": "Auslagen",
            "launcherName": "Auslagen",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#0E1412",
            "themeColorDark": "#0E1412",
            "navigationColor": "#0E1412",
            "navigationColorDark": "#0E1412",
            "navigationDividerColor": "#0E1412",
            "navigationDividerColorDark": "#0E1412",
            "backgroundColor": "#0E1412",
            "enableNotifications": true,
            "startUrl": "/Auslagen/index.html",
            "iconUrl": "https://beshoz.github.io/Auslagen/icon-512.png",
            "maskableIconUrl": "https://beshoz.github.io/Auslagen/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://beshoz.github.io/Auslagen/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://beshoz.github.io/Auslagen/",
            "minSdkVersion": 23,
            "signingKey": {
              "path": "KEYSTORE_PATH",
              "alias": "android"
            }
          }
          EOF
          sed -i "s|KEYSTORE_PATH|$GITHUB_WORKSPACE/keystore.jks|" twa/twa-manifest.json
          cat twa/twa-manifest.json

      - name: Build APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'auslagen' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'auslagen' }}
        run: |
          set -o pipefail
          yes | bubblewrap build --skipPwaValidation

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          find . -name "*.apk" -exec cp {} out/ \; || true
          find . -name "*.aab" -exec cp {} out/ \; || true
          cp "$GITHUB_WORKSPACE/fingerprint.txt" out/ || true
          if [ "${{ steps.keys.outputs.created }}" = "true" ]; then
            cp "$GITHUB_WORKSPACE/keystore.jks" out/
          fi
          ls -la out

      - name: Next steps
        if: always()
        run: |
          echo "=============================================="
          cat "$GITHUB_WORKSPACE/fingerprint.txt" || true
          echo ""
          echo "Put that SHA-256 into .well-known/assetlinks.json at the root"
          echo "of beshoz.github.io, or the app shows a URL bar."
          if [ "${{ steps.keys.outputs.created }}" = "true" ]; then
            echo ""
            echo "A NEW keystore is in the artifact. Back it up, then save it as"
            echo "repo secrets KEYSTORE_B64 (base64 of the file) and KEYSTORE_PASSWORD."
            echo "Without it you can never update an installed copy."
          fi
          echo "=============================================="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auslagen-android
          path: out/
